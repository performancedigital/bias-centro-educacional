    <style>
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background-color: #ffffff;
      }
      .reveal { opacity: 0; transition: all 1s cubic-bezier(0.17, 0.55, 0.55, 1); transform: translateY(40px); }
      .reveal.active { opacity: 1; transform: translateY(0); }

      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 20px 40px rgba(0,0,0,0.03);
      }
      
      .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 4px;
        background: linear-gradient(to right, #0047AB, #FFB800);
        z-index: 1000;
        transition: width 0.1s;
      }

      .text-gradient {
        background: linear-gradient(135deg, #0047AB 0%, #002D6B 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .hover-shine {
        position: relative;
        overflow: hidden;
      }
      .hover-shine::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
        transform: rotate(45deg);
        transition: 0.7s;
      }
      .hover-shine:hover::after {
        left: 100%;
      }
    </style>

  <body class="bg-white text-slate-900 antialiased selection:bg-bias-yellow selection:text-bias-blue overflow-x-hidden">
    <div class="scroll-progress" id="scrollBar"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      window.addEventListener('scroll', () => {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (winScroll / height) * 100;
        document.getElementById("scrollBar").style.width = scrolled + "%";

        const reveals = document.querySelectorAll(".reveal");
        reveals.forEach(reveal => {
          const windowHeight = window.innerHeight;
          const revealTop = reveal.getBoundingClientRect().top;
          if (revealTop < windowHeight - 100) {
            reveal.classList.add("active");
          }
        });
      });
    </script>
  </body>

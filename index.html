
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIAS | Cursos Técnicos Reconhecidos MEC e SISTEC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bias: {
                blue: '#0047AB',
                navy: '#002D6B',
                yellow: '#FFB800',
                gold: '#E6A600',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 8s ease-in-out 2s infinite',
              'marquee': 'marquee 30s linear infinite',
              'pulse-soft': 'pulse-soft 3s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                '50%': { transform: 'translateY(-20px) rotate(2deg)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              'pulse-soft': {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.9', transform: 'scale(1.02)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        margin: 0;
        padding: 0;
        background-color: #ffffff;
      }
      .bg-bias-blue { background-color: #0047AB; }
      .text-bias-blue { color: #0047AB; }
      .bg-bias-yellow { background-color: #FFB800; }
      .text-bias-yellow { color: #FFB800; }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .reveal { opacity: 0; transition: all 0.8s ease-out; transform: translateY(20px); }
      .reveal.active { opacity: 1; transform: translateY(0); }

      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      
      .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 3px;
        background: #FFB800;
        z-index: 100;
        transition: width 0.1s;
      }
    </style>

    <script type="importmap">

  "imports": {
    "react": "https://esm.sh/react@19.0.0",

  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-bias-yellow selection:text-bias-blue overflow-x-hidden">
    <div class="scroll-progress" id="scrollBar"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      window.addEventListener('scroll', () => {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (winScroll / height) * 100;
        document.getElementById("scrollBar").style.width = scrolled + "%";

        // Reveal animations
        const reveals = document.querySelectorAll(".reveal");
        reveals.forEach(reveal => {
          const windowHeight = window.innerHeight;
          const revealTop = reveal.getBoundingClientRect().top;
          const revealPoint = 150;
          if (revealTop < windowHeight - revealPoint) {
            reveal.classList.add("active");
          }
        });
      });
    </script>
    <noscript>
      <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=876824591991075&ev=PageView&noscript=1"
      />

  </body>
